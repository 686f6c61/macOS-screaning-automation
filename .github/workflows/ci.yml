name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# bash explícito activa `-eo pipefail` en todos los pasos.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and validate
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build Swift package
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Build app bundle
        run: |
          # Sin identidad de release en el runner se genera la variante Dev.
          APP_PATH="$(./scripts/build_app.sh)"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify app signature
        run: codesign --verify --deep --strict "$APP_PATH"

      - name: Validate metadata
        run: |
          plutil -lint Resources/Info.plist Resources/*.plist Resources/*.lproj/Localizable.strings
          ruby -c packaging/homebrew/screening-automation.rb
          swift package dump-package >/dev/null
